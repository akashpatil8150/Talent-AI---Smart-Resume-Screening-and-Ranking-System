services:
  - type: web
    name: ai-resume-screener
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt && python -c "import nltk; nltk.download('punkt'); nltk.download('punkt_tab'); nltk.download('stopwords')"
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120 --max-requests 1000 --access-logfile - --error-logfile -
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.7
      - key: SECRET_KEY
        generateValue: true
      - key: BERT_FORCE_CPU
        value: true
      - key: SKIP_BERT_PRECOMPUTE
        value: true
      - key: MATCHING_MODE
        value: hybrid
      - key: FLASK_DEBUG
        value: false
      - key: TOP_N_DEFAULT
        value: 100
      - key: MAX_FEATURES
        value: 150000
      - key: MIN_DF
        value: 2
      - key: BERT_MODEL_NAME
        value: sentence-transformers/all-MiniLM-L6-v2
      - key: BERT_BATCH_SIZE
        value: 8
      - key: BERT_DEVICE
        value: cpu
      - key: CACHE_DIR
        value: /app/.bert_cache
    healthCheckPath: /health
    disk:
      name: bert-cache
      mountPath: /app/.bert_cache
      sizeGB: 1
